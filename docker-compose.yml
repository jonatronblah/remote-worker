services:
  notebook:
    container_name: wrkr_notebook
    build:
      context: .
    command: uv run jupyter notebook --notebook-dir=/notebooks --ip 0.0.0.0 --no-browser --allow-root --ServerApp.token='' --ServerApp.password=''
    volumes:
      - ./notebooks:/notebooks
      - cache_vol:/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]    
    ports:
      - 8888:8888
    env_file:
      - .env

volumes:
  cache_vol:
    name: cache_vol