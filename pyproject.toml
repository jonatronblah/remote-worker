[project]
authors = [
  {name = "Jonathan Scheer", email = "jonatron@gmail.com"},
]
dependencies = [
  "altair>=5.5.0",
  "flash-attention>=1.0.0",
  "polars>=1.31.0",
  "rq>=2.4.0",
  "xformers>=0.0.31.post1",
  "rq-scheduler>=0.14.0",
  "safetensors>=0.5.3",
  "torch>=2.7.1",
  "torchaudio>=2.7.1",
  "torchvision>=0.22.1",
  "transformers>=4.53.2",
  "pydantic-settings>=2.10.1",
  "lightning>=2.5.2",
  "peft>=0.16.0",
  "pillow>=11.3.0",
  "typer>=0.16.0",
]
description = "Add your description here"
name = "remote-worker"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[tool.uv]
preview = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.uv.sources]
torch = {index = "pytorch"}
torchaudio = {index = "pytorch"}
torchvision = {index = "pytorch"}

[[tool.uv.index]]
explicit = true
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"

[dependency-groups]
dev = [
  "ipykernel>=6.29.5",
  "ipywidgets>=8.1.7",
  "notebook>=7.4.4",
  "pytest>=8.4.1",
  "ruff>=0.12.3",
]
